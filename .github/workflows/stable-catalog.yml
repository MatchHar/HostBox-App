name: Stable catalog audit

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/verify-stable-catalog.py
      - .github/workflows/stable-catalog.yml

permissions:
  contents: read

jobs:
  catalog-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/verify-stable-catalog.py
